---
services:
  graphite:
    image: "{{ .Image }}:{{ .ImageVersion }}"

    environment:
      # the service password. The bash plugin passes this too, but reads it
      # from a variable it never assigns, so every service it creates starts
      # with an empty one. Nothing in the image reads it today: grafana keeps
      # the admin account its own config names.
      GRAPHITE_PASSWORD: "{{ .Secret.password }}"

    volumes:
      - type: bind
        source: "{{ .HostRoot }}/data/grafana"
        target: /opt/grafana/data
      - type: bind
        source: "{{ .HostRoot }}/data/whisper"
        target: /opt/graphite/storage/whisper
      # graphite-web's own database, with its accounts and saved graphs. Its
      # path is fixed under the storage directory, beside everything else
      # there, so the file is bound on its own. The pre_create hook copies the
      # one the image ships, which already has its tables
      - type: bind
        source: "{{ .HostRoot }}/data/graphite-web/graphite.db"
        target: /opt/graphite/storage/graphite.db
        x-file: true
      # carbon's own configuration, which is where its storage schemas and
      # aggregation are set. The pre_create hook copies the files the image
      # ships here before the mount hides them
      - type: bind
        source: "{{ .HostRoot }}/config"
        target: /opt/graphite/conf

    ports:
      # where an app sends its metrics, which is what a linked app is handed.
      #
      # statsd speaks udp, which the bash plugin had no way to say and so
      # always exposed as tcp, where a statsd client off the host sends nothing.
      # The ambassador publishes and forwards a port over the protocol recorded
      # here, so an exposed service takes metrics over udp. Readiness refuses
      # to probe a udp port rather than silently connecting to one.
      - name: statsd
        target: 8125
        protocol: udp
        primary: true

      # statsd's own administrative interface
      - name: statsd_admin
        target: 8126

      # grafana, which is the page a person looks at
      - name: web
        target: 80

      - name: web_alt
        target: 81

      # where carbon accepts metrics in its own line protocol
      - name: carbon
        target: 2003

x-dokku:
  plugin: graphite
  # graphite's services have always been stored under the name of the image it
  # runs rather than the name it is called by, and an install that already has
  # them keeps them: moving live data to tidy up a directory name is not worth
  # what it risks
  data_directory: grafana-graphite-statsd
  title: Graphite
  scheme: statsd

  # STATSD rather than GRAPHITE, for the alias and for every variable the
  # plugin reads. The one exception is GRAPHITE_DISABLE_PULL, which is derived
  # from the name instead, and the two rules look identical without being it.
  alias: STATSD
  variable: STATSD
  alt_alias: DOKKU_STATSD

  dsn: "{{ .Scheme }}://{{ .Host }}:{{ .Port.statsd }}"

  # readiness is grafana rather than the metrics port: statsd speaks udp, where
  # a connection proves nothing, and the third entry in a list is what the bash
  # plugin had to name this by position
  wait: web

  secrets:
    password:
      file: PASSWORD
      length: 16
      env: SERVICE_PASSWORD

      # only ever handed to the container as GRAPHITE_PASSWORD, which nothing
      # in the image reads, so a new password is a container made again
      rebuild: true

  hooks:
    pre_create:
      # the database graphite-web ships, copied out so the service keeps its
      # own rather than one a rebuild throws away. Left alone when it is
      # already there, since after the first time it is the service's data.
      #
      # carbon's configuration as well, copied from where the image keeps it,
      # which the service's mount does not hide here since the hook runs in a
      # container of its own without the service's volumes
      volumes:
        - type: bind
          source: "{{ .HostRoot }}/data/graphite-web"
          target: /seed
        - type: bind
          source: "{{ .HostRoot }}/config"
          target: /seed-config
      exec:
        - sh
        - -c
        # -n so that an operator's edits are never overwritten: the files are
        # theirs once they exist
        - >-
          (test -f /seed/graphite.db || cp -p /opt/graphite/storage/graphite.db /seed/graphite.db) &&
          cp -n /opt/graphite/conf/* /seed-config/

  documentation:
    - title: Configuring carbon
      body: |
        carbon's configuration is kept in '/var/lib/dokku/services/grafana-graphite-statsd/lollipop/config', which is mounted at '/opt/graphite/conf' in the container.
        the files the image ships there are copied in when the service is created, and a file already there is never overwritten, so edits are kept when the service is rebuilt or upgraded.
        the copies are owned by root, so edit them as root, and restart the service for carbon to read them:
            sudo editor /var/lib/dokku/services/grafana-graphite-statsd/lollipop/config/storage-schemas.conf
        dokku {{.Command "restart"}} lollipop
        carbon applies 'storage-schemas.conf' and 'storage-aggregation.conf' when it creates the file for a metric, so a metric it already has a file for keeps the retention it was created with.
        a service created before its configuration was mounted has the files it does not already have copied in the next time its container is made, and keeps any file placed there before.
        the container is kept by a restart, so stop and start the service instead:
        dokku {{.Command "stop"}} lollipop
        dokku {{.Command "start"}} lollipop
    - title: Dashboards
      body: |
        grafana starts with two dashboards in its 'Dokku' folder, which is reached once grafana is exposed and logged in to with grafana's own admin account:
        dokku {{.Command "nginx-expose"}} lollipop
        the 'Graphite' dashboard shows carbon and statsd themselves, which have data as soon as the service is up.
        the 'StatsD' dashboard shows the counters, timers and gauges apps send to statsd, at the 'STATSD_URL' a linked app is handed:
        dokku {{.Command "link"}} lollipop playground
        its 'namespace' picker lists the first part of each metric's name, so an app that prefixes every metric it sends with its own name, such as 'playground.requests', can be picked out from the rest.
        the dashboards are written again each time the container is made, so grafana refuses to save a change to one. Save a copy under another name to change it, which is kept with grafana's other dashboards.
        metrics about the host itself need a collector running there that writes carbon's line protocol, which carbon takes on its port once the service is exposed:
        dokku {{.Command "expose"}} lollipop 8125 8126 8080 8081 2003
        a service made before the dashboards were shipped has them the next time its container is made. The container is kept by a restart, so stop and start the service instead:
        dokku {{.Command "stop"}} lollipop
        dokku {{.Command "start"}} lollipop
        a service still on grafana 6 has them once it is upgraded:
        dokku {{.Command "upgrade"}} lollipop

  # no connect, export or import: graphite is a metrics store reached over its
  # own protocols, and the image ships no client and no dump tool. Clone and
  # the backup family fall out of that, which is the list the bash plugin kept
  # by hand.
  commands:
    # the metrics, which are every file carbon has written. Grafana's database
    # and graphite-web's hold accounts and dashboards rather than metrics, and
    # are kept. Offline, as carbon caches points it has not written yet and
    # would write them back after the files were deleted, and the render api
    # answers from that cache too; stopping the service drops both. The
    # directory itself is kept, since it is what the volume is mounted on.
    reset:
      mode: offline
      exec: ["find", '{{ index .Target "data/whisper" }}', "-mindepth", "1", "-delete"]

  custom_commands:
    nginx-expose:
      # on the host, because what it produces is configuration for the host's
      # own nginx. The script runs unprivileged and hands the finished vhost to
      # the privileged helper, which is the only part that is granted root.
      mode: host
      description: expose the {{.Title}} service's grafana via an nginx vhost
      documentation: |
        expose the {{.Title}} service's grafana via an nginx vhost
        > NOTE: with no domain, grafana answers to grafana-<service>.<vhost> for every global vhost
        dokku {{.Command "nginx-expose"}} lollipop
        dokku {{.Command "nginx-expose"}} lollipop example.com
      arguments:
        - name: domain
          description: a domain to expose grafana on, defaulting to the global vhosts
          optional: true
      exec:
        - nginx-expose
        # an absent domain renders empty and is dropped, so the script sees no
        # argument at all rather than an empty one
        - "{{ .Args.domain }}"
      env:
        GRAPHITE_SERVICE: "{{ .ServiceName }}"
        GRAPHITE_CONTAINER: "{{ .ContainerName }}"

    nginx-unexpose:
      mode: host
      description: unexpose the {{.Title}} service's grafana
      documentation: |
        unexpose the {{.Title}} service's grafana
        dokku {{.Command "nginx-unexpose"}} lollipop
      exec:
        - nginx-unexpose
      env:
        GRAPHITE_SERVICE: "{{ .ServiceName }}"
